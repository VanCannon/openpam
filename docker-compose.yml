services:
  postgres:
    image: postgres:16
    container_name: openpam-postgres
    environment:
      POSTGRES_DB: openpam
      POSTGRES_USER: openpam
      POSTGRES_PASSWORD: openpam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpam"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: openpam-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  guacd:
    image: guacamole/guacd
    container_name: openpam-guacd
    ports:
      - "4822:4822"
    environment:
      - GUACD_LOG_LEVEL=debug
    dns:
      - 192.168.10.184
    command: ["-L", "debug", "-b", "0.0.0.0"]

  nats:
    image: nats:2.10
    container_name: openpam-nats
    ports:
      - "4222:4222"

  orchestrator:
    build: ./orchestrator
    container_name: openpam-orchestrator
    ports:
      - "8090:8090"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=openpam
      - DB_PASSWORD=openpam
      - DB_NAME=openpam
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build: ./identity
    container_name: openpam-identity
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=openpam
      - DB_PASSWORD=openpam
      - DB_NAME=openpam
    depends_on:
      orchestrator:
        condition: service_started

  activity:
    build: ./activity
    container_name: openpam-activity
    ports:
      - "8083:8083"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - LETS_ENCRYPT_EMAIL=admin@example.com # Placeholder if needed
      - LETS_ENCRYPT_EMAIL=admin@example.com # Placeholder if needed
      - AD_HOST=192.168.10.184
      - AD_PORT=389
      - AD_BASE_DN=DC=vancannon,DC=com
      - AD_BIND_DN=CN=Billy VanCannon,OU=Corporate,DC=vancannon,DC=com
      - AD_BIND_PASSWORD=Mp4mKt!8
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=openpam
      - DB_PASSWORD=openpam
      - DB_NAME=openpam
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduling:
    build: ./scheduling
    container_name: openpam-scheduling
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PASSWORD=openpam
      - NATS_URL=nats://nats:4222
    depends_on:
      orchestrator:
        condition: service_started
      nats:
        condition: service_started

  gateway:
    build: ./gateway
    container_name: openpam-gateway
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=openpam
      - DB_PASSWORD=openpam
      - DB_NAME=openpam
      - NATS_URL=nats://nats:4222
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
      - DEV_MODE=true
      - IDENTITY_URL=http://identity:8082
      - ORCHESTRATOR_URL=http://orchestrator:8090
      - ACTIVITY_URL=http://activity:8083
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  postgres_data:
